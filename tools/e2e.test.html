<!DOCTYPE html>
<!-- E2E 夹具：headless 浏览器渲染用，验证升级前后两次输出与最终升级状态 -->
<html>
<body>
	<input id="学弟" type="number">
	<div id="恶臭"></div>
	<div id="结果"></div>
	<script src="../homo.js"></script>
	<script>
		const cases = [1919810, 229027, 1919, 114514, 0.25, -42];
		const 收集 = {};
		const F = n => { if (n < 0 || n !== Math.floor(n) || n > 170) throw 0; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
		const SQ = x => { const r = Math.sqrt(x), rr = Math.round(r); return Math.abs(r - rr) <= 1e-9 * Math.max(1, Math.abs(rr)) ? rr : r; };
		const FL = Math.floor, POW = (a, b) => a ** b, FLSQ = x => Math.floor(Math.sqrt(x));
		const 验证 = (s) => { try { return String((new Function('F','SQ','FL','POW','FLSQ','return (' + s + ')'))(F,SQ,FL,POW,FLSQ)); } catch (e) { return 'ERR:' + e.message; } };

		const snapshot = (tag) => {
			for (const c of cases) {
				const s = homo.evalStr(c);
				(收集[c] = 收集[c] || {})[tag] = [s, 验证(s)];
			}
		};
		snapshot('baseline');
		homo.onUpgrade = () => {
			snapshot('extended');
			结果.textContent = JSON.stringify({ 收集, ready: homo.ready() });
		};
		// 兜底：如果 onUpgrade 早已触发（时序），1s 后也写一次
		setTimeout(() => {
			if (!结果.textContent) { snapshot('extended'); 结果.textContent = JSON.stringify({ 收集, ready: homo.ready() }); }
		}, 1500);
	</script>
</body>
</html>
